<!DOCTYPE html>
<html>

<head>
    <title>Cat Calculator</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <body class="cat-page"></body>

    <div class="calculator">
        <h1 class="text">SQUARE</h1>
        <h2 class="text">Square area calculator</h2>

        <input class="input" id="numberInput" type="number" placeholder="Enter number">

        <button id="calculateBtn" class="calculate"></button>

        <p id="result">Result:</p>

    </div>
    <div class="calculator">

        <h2 class="text">Perimeter area calculator</h2>

        <input id="sideInput" type="number" placeholder="Enter side length">

        <button id="btn2">Calculate</button>

        <p id="result2">Result:</p>

    </div>

    <h1 class="text">RECTANGLE</h1>
    <div class="calculator">

        <h2 class="text">Square area calculator</h2>

        <div class="inputs">
            <input id="lengthInput" type="number" placeholder="Length">

            <input id="widthInput" type="number" placeholder="Width">
        </div>

        <button id="rectangleAreaBtn">Calculate</button>

        <p id="rectangleAreaResult">Result:</p>

    </div>

    <div class="calculator">

        <h2 class="text">Rectangle perimeter calculator</h2>

        <div class="inputs">
            <input id="perimeterLength" type="number" placeholder="Length">

            <input id="perimeterWidth" type="number" placeholder="Width">
        </div>

        <button id="rectanglePerimeterBtn">Calculate</button>

        <p id="rectanglePerimeterResult">Result:</p>

    </div>



    <script src="script.js"></script>
</body>

</html>
