<!DOCTYPE html>
<html>

<head>
    <title>Cat Calculator</title>
    <link rel="stylesheet" href="index.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="cat-page">


    <div class="calculator">
        <h1 class="text">SQUARE</h1>
        <h2 class="text">Square area calculator</h2>

        <input class="input" id="numberInput" type="number" placeholder="Enter number">

        <button id="calculateBtn" class="calculate"></button>

        <p id="result">Result:</p>

    </div>
    <div class="calculator">

        <h2 class="text">Perimeter area calculator</h2>

        <input class="input" id="sideInput" type="number" placeholder="Enter side length">

        <button id="btn2" class="calculate"></button>

        <p id="result2">Result:</p>

    </div>

    <div class="calculator">

        <h1 class="text">RECTANGLE</h1>

        <h2 class="text">Square area calculator</h2>

        <div class="inputs">
            <input id="lengthInput" type="number" placeholder="Length">

            <input id="widthInput" type="number" placeholder="Width">
        </div>

        <button id="rectangleAreaBtn" class="calculate"></button>

        <p id="rectangleAreaResult">Result:</p>

    </div>

    <div class="calculator">

        <h2 class="text">Rectangle perimeter calculator</h2>

        <div class="inputs">
            <input id="perimeterLength" type="number" placeholder="Length">

            <input id="perimeterWidth" type="number" placeholder="Width">
        </div>

        <button id="rectanglePerimeterBtn" class="calculate"></button>

        <p id="rectanglePerimeterResult">Result:</p>

    </div>



    <div class="calculator">
        <h1 class="text">CIRCLE</h1>
        <h2 class="text">Circle area calculator</h2>

        <div class="inputs">
            <input id="radiusInput" type="number" placeholder="Radius">
        </div>

        <button id="circleAreaBtn" class="calculate"></button>

        <p id="circleAreaResult">Result:</p>

    </div>

    <div class="calculator">
<h2 class="text">Circle perimeter calculator</h2>
        <div class="inputs">
            <input id="radiusInput2" type="number" placeholder="Radius"> <!-- ИСПРАВЛЕНО -->
        </div>
        <button id="circlePerimeterBtn" class="calculate"></button>
        <p id="circlePerimeterResult">Result:</p>

    </div>



    <script src="script.js"></script>
</body>

</html>
